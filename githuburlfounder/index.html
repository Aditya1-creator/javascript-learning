```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GitHub User Finder</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Load your JavaScript after HTML is parsed -->
    <script src="script.js" defer></script>
</head>

<body class="min-h-screen bg-slate-950 text-white">

    <!-- Main Container -->
    <main class="max-w-5xl mx-auto px-5 py-12">

        <!-- Heading -->
        <header class="text-center mb-10">

            <div class="text-5xl mb-4">🐙</div>

            <h1 class="text-4xl font-bold">
                GitHub User Finder
            </h1>

            <p class="text-slate-400 mt-3">
                Discover GitHub profiles and explore their repositories.
            </p>

        </header>


        <!-- Search Section -->
        <section class="max-w-2xl mx-auto">

            <form id="searchForm"
                  class="flex flex-col sm:flex-row gap-3">

                <input
                    type="text"
                    id="usernameInput"
                    class="flex-1 rounded-xl border border-slate-700
                           bg-slate-900 px-5 py-4 outline-none
                           focus:border-blue-500"
                    placeholder="Enter GitHub username..."
                    autocomplete="off"
                >

                <button
                    type="submit"
                    id="searchButton"
                    class="rounded-xl bg-blue-600 px-7 py-4
                           font-semibold hover:bg-blue-500"
                >
                    Search
                </button>

            </form>

            <p class="text-center text-sm text-slate-500 mt-3">
                Try searching for a public GitHub username.
            </p>

        </section>


        <!-- Initial Empty State -->
        <section id="emptyState"
                 class="text-center mt-16">

            <div class="text-5xl mb-5">🔎</div>

            <h2 class="text-xl font-semibold">
                Find a GitHub developer
            </h2>

            <p class="text-slate-400 mt-2">
                Enter a username above to view their profile.
            </p>

        </section>


        <!-- Profile Card Container -->
        <!-- JavaScript inserts the generated profile card here -->
        <section id="profile"
                 class="hidden mt-10">

        </section>


        <!-- Repository Section -->
        <!-- JavaScript inserts repository cards here -->
        <section class="mt-10">

            <h2 id="repositoryHeading"
                class="hidden text-2xl font-bold mb-5">
                Public Repositories
            </h2>

            <div id="repositories"
                 class="grid grid-cols-1 md:grid-cols-2 gap-5">

            </div>

        </section>


        <!-- Footer -->
        <footer class="text-center text-slate-500 text-sm mt-16">
            Built with JavaScript and the GitHub API.
        </footer>

    </main>

</body>
</html>
```
