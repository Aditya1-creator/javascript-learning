<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music Player</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="player">

        <!-- Progress Bar -->
        <div class="progress-container">
            <div id="progress"></div>
        </div>

        <!-- Percentage -->
        <div id="percentage">
            0%
        </div>

        <!-- Controls -->
        <div class="controls">

            <button id="playBtn">
                ▶
            </button>

            <div id="fileName">
                Song.mp3
            </div>

            <button id="downloadBtn">
                Download File
            </button>

        </div>

    </div>


    <!-- Your JavaScript -->
    <script src="script.js"></script>

</body>
</html>
